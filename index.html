<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--ink:#f6f4fb;--mute:rgba(246,244,251,.62);--line:rgba(246,244,251,.16);
--teal:#7ee8d6;--sky:#8fd3ff;--lav:#c1a8ff;--pink:#ffb3d9;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.hero{position:relative;height:100%;width:100%;overflow:hidden}
.glow{position:absolute;inset:0;background:
radial-gradient(40% 40% at 50% 50%,rgba(143,211,255,.10),transparent 70%),
radial-gradient(30% 30% at 62% 44%,rgba(255,179,217,.08),transparent 70%),
radial-gradient(30% 30% at 38% 58%,rgba(126,232,214,.08),transparent 70%)}
#stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
nav{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
padding:calc(22px + env(safe-area-inset-top,0px)) clamp(20px,4vw,48px) 0;pointer-events:none}
nav>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 26px/1 var(--serif);letter-spacing:.04em}
.brand svg{width:30px;height:30px}
.links{display:flex;gap:32px}
.links a{color:var(--mute);text-decoration:none;font-size:14px;transition:color .2s}
.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border-radius:999px;font:500 14px var(--sans);text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn.solid{background:var(--ink);color:#0a0a0f}
.btn.solid:hover{transform:translateY(-1px)}
.btn.ghost{border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:rgba(246,244,251,.4)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.copy{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center;
padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));pointer-events:none;
background:linear-gradient(to top,rgba(5,5,7,.88) 0%,rgba(5,5,7,.55) 55%,transparent 100%)}
.copy>*{pointer-events:auto}
h1{font:500 clamp(44px,8vw,104px)/.98 var(--serif);letter-spacing:-.01em;max-width:14ch}
.sub{margin-top:18px;max-width:46ch;color:var(--mute);font-size:clamp(15px,1.6vw,18px);line-height:1.55}
.cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hint{position:absolute;z-index:2;right:clamp(20px,4vw,48px);top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;
font-size:12px;color:var(--mute);pointer-events:none;white-space:nowrap}
@media(max-width:720px){.links{display:none}.hint{display:none}}
@media (prefers-reduced-motion:no-preference){.copy{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}}
.hand{position:absolute;z-index:1;right:clamp(12px,5vw,80px);bottom:0;height:min(86vh,115vw);aspect-ratio:560/659}
#hc{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{inset:auto;left:30%;top:-8%;width:50%;height:auto;aspect-ratio:1/1}
.copy{right:auto;left:clamp(20px,5vw,72px);bottom:0;align-items:flex-start;text-align:left;max-width:min(560px,48vw);padding:0 0 calc(56px + env(safe-area-inset-bottom,0px));background:none}
.cta{justify-content:flex-start}
h1{font-size:clamp(44px,6.2vw,96px);max-width:none}
.hint{display:none}
@media(max-width:820px){.hand{right:auto;left:50%;transform:translateX(-50%);height:min(50vh,100vw)}
.copy{left:0;right:0;top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;max-width:none;align-items:center;text-align:center;padding:0 20px}
.cta{justify-content:center}.sub{display:none}h1{font-size:clamp(40px,11vw,64px)}}
.brand img{height:30px;width:auto;display:block}@media(max-width:820px){.brand img{height:24px}}
nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
nav .brand{grid-column:2;justify-self:center}
nav .links:not(.r){grid-column:1;justify-self:start}
nav .links.r{grid-column:3}
.links.r{justify-self:end}
@media (prefers-reduced-motion:no-preference){
.hand{animation:float 8s ease-in-out infinite}
#stage{animation:float2 11s ease-in-out -3s infinite}
@keyframes float{0%,100%{translate:0 0;rotate:-.7deg}50%{translate:0 -16px;rotate:.9deg}}
@keyframes float2{0%,100%{translate:0 0}33%{translate:7px -12px}66%{translate:-6px -5px}}}
</style>
</head>
